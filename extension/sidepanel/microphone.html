<!doctype html>
<html lang="en">
<head>

  <link rel="stylesheet" href="sidepanel.css">
  <script type="module" src="microphone.js"></script>

<body class="page">
  <h1>Allow the microphone</h1>

  <button id="mic-again" class="secondary" type="button" hidden>Ask again</button>
