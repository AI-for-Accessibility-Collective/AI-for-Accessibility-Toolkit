<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script type="module" src="sidepanel.js"></script>
</head>
<body>
  <header>
    <img class="mark" src="../icons/icon-48.png" alt="" width="28" height="28">
    <div><h1>Assistant</h1><p class="sub">Build adapters</p></div>
    <span id="state" class="badge">Starting</span>
  </header>

  <section id="not-connected" class="connect-notice" hidden>
    <h2>Connect to your toolkit first</h2>
    <p>Open this extension from the toolbar and choose <strong>Connect with this console</strong>, or enter your toolkit’s address and default token. Then come back here.</p>
  </section>

  <main id="main" hidden>
    <div class="chat-bar">
      <select id="chat-select" aria-label="Chat"></select>
      <button id="delete-chat" class="secondary" type="button">Delete</button>
      <button id="new-chat" class="secondary" type="button">New chat</button>
    </div>
    <section id="working" class="working-bar" aria-label="The page this chat works on" hidden>
      <p id="working-label"></p>
      <div class="row">
        <button id="go-to-page" class="secondary" type="button" hidden>Go to that tab</button>
        <button id="switch-page" class="secondary" type="button" hidden>Work on this page instead</button>
      </div>
    </section>

    <div id="conversation" class="conversation">
      <ol id="transcript" class="transcript" aria-label="Conversation"></ol>
      <div id="questions" class="requests"></div>
      <div id="requests" class="requests"></div>
      <section id="ready" class="ready" hidden aria-labelledby="ready-heading">
        <h2 id="ready-heading">Ready to use</h2>
        <ul id="ready-list"></ul>
      </section>
    </div>

    <div id="preview-bar" class="preview-bar" hidden>
      <span id="preview-label"></span>
      <button id="preview-toggle" class="switch" type="button" role="switch" aria-checked="true" aria-describedby="preview-label">Preview</button>
    </div>

    <form id="composer" class="composer">
      <label for="message" class="visually-hidden">Message to the assistant</label>
      <textarea id="message" rows="3" placeholder="Additional requests?"></textarea>
      <div class="composer-actions">
        <label class="check"><input id="auto-preview" type="checkbox"> Apply previews automatically</label>
        <button id="stop" class="secondary" type="button" hidden>Stop</button>
        <button id="send" class="primary" type="submit">Send</button>
      </div>
    </form>
  </main>

  <p id="status" role="status" aria-live="polite"></p>
  <!-- What changes, said once: the conversation itself is not a live region. -->
  <div id="live" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="alert" class="visually-hidden" role="alert" aria-atomic="true"></div>
</body>
</html>
