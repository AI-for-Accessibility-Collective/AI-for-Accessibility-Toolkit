# Runs the two real-browser suites in headless Chromium:
#   npm run validate:browser              each adapter's real effect and its
#                                         exact reversal in a real layout
#   npm run test:e2e                      onboarding/test/chat-e2e.mjs, the only
#                                         test that executes onboarding/chat.js
#
# A separate workflow file on purpose. ci.yml runs `npm test`, which excludes
# anything that needs a browser, and that split is deliberate: a Chromium
# download is slow and can fail for reasons unrelated to the change under test.
# This job keeps that risk out of ci.yml.
#
# It does not block a merge, and the reason is branch protection, not this
# file. A check blocks a merge only when it is listed as a required status
# check on the target branch, and at the time of writing main lists none. A
# red run here shows on the pull request and in the Actions tab like any
# other failure, and the maintainer decides what to do with it. The job is
# deliberately not marked continue-on-error: on a job, that keyword only turns
# the workflow run green in the Actions tab and stops the failure
# notification, and it does not change whether the check blocks. The suites
# here are the ones most likely to be flaky, and a flaky required check gets
# ignored or bypassed; a visible optional one is the middle ground proposed
# in issue #29. Add this job to the required list only once it has been green
# for a while, and drop the paths filter in the same change, or pull requests
# outside those paths will wait on a check that never reports.
#
# The two suites run one after the other, never in parallel: two Chromium
# instances on a shared runner are how browser tests time out.
name: browser

# FLAG(review): the two paths lists below are a hand reading of what the
# suites import at this commit, not something checked by code. A new import
# from a directory outside them stops triggering this job, and nothing warns.
on:
  push:
    branches: [main]
    paths:
      - 'onboarding/**'
      - 'controller/**'
      - 'tools/**'
      - 'toolkit/**'
      - 'server/src/**'
      - 'server/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser.yml'
  pull_request:
    paths:
      - 'onboarding/**'
      - 'controller/**'
      - 'tools/**'
      - 'toolkit/**'
      - 'server/src/**'
      - 'server/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser.yml'

jobs:
  real-browser:
    runs-on: ubuntu-latest
    # FLAG(review): the first run of this job took 7 min 34 s, 7 min 1 s of it
    # in npm ci, so 20 is a ceiling with room for a slow registry, not a tuned
    # number. If it fires, the check reads as a failure unrelated to the change.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Both suites import the npm `playwright` package, so the browser comes
      # from npx after `npm ci`, which pins it to the version in
      # package-lock.json, not from `python -m playwright` as in cli.yml.
      # Both suites launch headless with no channel, which Playwright runs on
      # chromium-headless-shell, so only that build is downloaded. Drop
      # --only-shell if a suite ever launches headed or names a channel.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps --only-shell chromium

      - name: Adapter validation in a real layout
        id: validate
        run: npm run validate:browser

      # Runs even when the previous suite failed, so one run shows both results,
      # but not when a setup step failed before validate could start: then the
      # summary would blame this suite for a missing Chromium or node_modules.
      - name: Chat end-to-end
        id: e2e
        if: ${{ !cancelled() && steps.validate.outcome != 'skipped' }}
        run: npm run test:e2e

      - name: Record the outcome
        if: ${{ always() }}
        run: |
          {
            echo "## Real-browser suites"
            echo
            echo "| Suite | Outcome |"
            echo "|---|---|"
            echo "| tools/test/browser-validate.js | ${{ steps.validate.outcome }} |"
            echo "| onboarding/test/chat-e2e.mjs | ${{ steps.e2e.outcome }} |"
            echo
            echo "This job is not a required status check, so it does not block a merge. A failure here is worth reading, not ignoring."
          } >> "$GITHUB_STEP_SUMMARY"
