name: CI

on:
  push:
    branches: [main, "release-candidate/**"]
  pull_request:
    branches: [main, "release-candidate/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # jsdom (via html-encoding-sniffer -> @exodus/bytes) ships ESM that must
        # be require()d, which Node 18 cannot do (ERR_REQUIRE_ESM). That support
        # only exists from Node 20.19. Test the current LTS lines, not EOL 18.
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test suites (same command developers run)
        # npm test covers toolkit/test, tools/test, controller/test, and
        # onboarding/test — the one list CONTRIBUTING points contributors at,
        # so CI cannot drift from it. browser-validate.js is intentionally NOT
        # a *-test.js file. It needs a real Chromium, so it runs in the
        # separate, non-blocking browser.yml instead of here.
        run: npm test

      - name: Reference hosts run
        run: |
          node toolkit/hosts/xr-demo/demo.js
          node toolkit/hosts/skill-demo/demo.js

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install dependencies
        run: npm ci
      - name: Toolkit service tests
        run: |
          node server/test/server-test.mjs
          node server/test/delete-cascade.test.mjs
          node server/test/gcs-pagination.test.mjs

      - name: Toolkit package self-check
        # Validates the package exactly as npm would publish it, catching
        # manifest drift (files list vs exports map) that in-repo tests cannot
        # see because they resolve against the working tree.
        run: |
          cd toolkit
          npm pack --dry-run
          npx --yes publint
