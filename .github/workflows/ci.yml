name: CI

on:
  push:
    branches: [main, "release-candidate/**"]
  pull_request:
    branches: [main, "release-candidate/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # jsdom (via html-encoding-sniffer -> @exodus/bytes) ships ESM that must
        # be require()d, which Node 18 cannot do (ERR_REQUIRE_ESM). That support
        # only exists from Node 20.19. Test the current LTS lines, not EOL 18.
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Toolkit core tests
        run: |
          for t in toolkit/test/*-test.js; do echo "== $t"; node "$t" || exit 1; done
          for t in toolkit/test/*.test.mjs; do echo "== $t"; node "$t" || exit 1; done

      - name: Reference hosts run
        run: |
          node toolkit/hosts/xr-demo/demo.js
          node toolkit/hosts/skill-demo/demo.js

      - name: Adapter / auditor / profile catalog tests
        # tools/ is the developer catalog of adapters, auditors, and profiles.
        # browser-validate.js is intentionally NOT a *-test.js file — it needs a
        # real Chromium and runs locally only.
        run: |
          for t in tools/test/*-test.js; do echo "== $t"; node "$t" || exit 1; done

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install dependencies
        run: npm ci
      - name: Toolkit service tests
        run: node server/test/server-test.mjs
