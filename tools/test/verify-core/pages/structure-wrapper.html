<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Structure: a page wrapper around a site header div, the story and a site footer div</title>
</head>
<body>
  <!-- No header or footer elements. Nothing is named main: the story is a region inside the wrapper. -->
  <div id="page">
    <div id="masthead" class="site-header">
      <p>Riverside Library</p>
    </div>
    <div id="story">
      <div id="story-header" class="entry-header">
        <h1>Opening hours this winter</h1>
      </div>
      <p>From the first of December the library opens an hour later on weekdays and closes at six. Saturday hours stay the same, and the reading room is open on Sundays from noon.</p>
    </div>
    <div id="colophon" class="site-footer">
      <p>© 2026 Riverside Library. 12 River Street.</p>
    </div>
  </div>
</body>
</html>
