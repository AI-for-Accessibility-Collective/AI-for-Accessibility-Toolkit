<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Structure: a story's header and footer divs, and no site header or footer</title>
</head>
<body>
  <!-- No site header or footer: the only header and footer divs are the story's. -->
  <div id="main-content" class="main">
    <div id="entry-header" class="entry-header">
      <h1>Opening hours this winter</h1>
    </div>
    <p>From the first of December the library opens an hour later on weekdays and closes at six. Saturday hours stay the same, and the reading room is open on Sundays from noon.</p>
    <div id="entry-footer" class="entry-footer">
      <p>Posted by the front desk team.</p>
    </div>
  </div>
</body>
</html>
