<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Structure: a hidden header element and a site header div</title>
</head>
<body>
  <!-- A header for small screens, hidden here: the browser exposes no banner for it. -->
  <header id="small-header" style="display: none">
    <p>Riverside Library</p>
  </header>
  <div id="masthead" class="site-header">
    <p>Riverside Library: opening hours, events and the catalog.</p>
  </div>
  <div id="content">
    <h1>Opening hours this winter</h1>
    <p>From the first of December the library opens an hour later on weekdays and closes at six. Saturday hours stay the same, and the reading room is open on Sundays from noon.</p>
  </div>
</body>
</html>
