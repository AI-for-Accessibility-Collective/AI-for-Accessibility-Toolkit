<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Structure: a page wrapper, and a post footer inside the content</title>
</head>
<body>
  <div id="page">
    <header id="site-top">
      <p>Riverside Library</p>
    </header>

    <div id="story">
      <h1>Opening hours this winter</h1>
      <p>From the first of December the library opens an hour later on weekdays and closes at six. Saturday hours stay the same, and the reading room is open on Sundays from noon.</p>
      <div class="post-meta">
        <footer id="post-footer">Posted by the front desk team.</footer>
      </div>
    </div>

    <footer id="site-bottom">
      <p>© 2026 Riverside Library. 12 River Street.</p>
    </footer>
  </div>
</body>
</html>
