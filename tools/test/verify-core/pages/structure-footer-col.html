<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Structure: a site footer div with a column header, and no site header</title>
</head>
<body>
  <div id="main" class="main">
    <h1>Opening hours this winter</h1>
    <p>From the first of December the library opens an hour later on weekdays and closes at six. Saturday hours stay the same, and the reading room is open on Sundays from noon.</p>
  </div>
  <!-- The page's only header element is this column's, in a div of the site footer. -->
  <div id="colophon" class="site-footer">
    <div class="footer-col">
      <header id="col-header">
        <h2>Visit us</h2>
      </header>
      <p>12 River Street, open every day.</p>
    </div>
    <p>© 2026 Riverside Library.</p>
  </div>
</body>
</html>
