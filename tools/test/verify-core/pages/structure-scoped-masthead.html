<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Structure: masthead and colophon divs, story header and footer</title>
</head>
<body>
  <div id="page">
    <div id="site-masthead" class="site-header">
      <p>Riverside Library</p>
    </div>

    <!-- Not named main: the largest region, with the story's header and footer in it. -->
    <div id="main-article">
      <header>
        <h1>Opening hours this winter</h1>
      </header>
      <p>From the first of December the library opens an hour later on weekdays and closes at six. Saturday hours stay the same, and the reading room is open on Sundays from noon.</p>
      <footer>
        <p>Posted by the front desk team.</p>
      </footer>
    </div>

    <div id="site-colophon" class="site-footer">
      <p>© 2026 Riverside Library. 12 River Street.</p>
    </div>
  </div>
</body>
</html>
