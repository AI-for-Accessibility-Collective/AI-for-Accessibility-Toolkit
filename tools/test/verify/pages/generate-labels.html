<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Generate Labels Test Page - Aurora Gear Shop</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #f8fafc;
      color: #0f172a;
      line-height: 1.5;
    }
    header, main, footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }
    nav {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    a, button, [role="button"] {
      min-width: 24px;
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #0369a1;
      text-decoration: none;
      border-radius: 4px;
    }
    a:focus-visible, button:focus-visible, [role="button"]:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid #0284c7;
      outline-offset: 2px;
    }
    button {
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      padding: 0.375rem 0.75rem;
      font-size: 0.875rem;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      padding: 6px;
    }
    .section-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .form-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    input, select {
      min-height: 36px;
      padding: 0.375rem 0.5rem;
      border: 1px solid #94a3b8;
      border-radius: 4px;
      font-size: 0.875rem;
      color: #0f172a;
      background: #ffffff;
    }
    iframe {
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      width: 100%;
      height: 120px;
      display: block;
      margin-top: 0.5rem;
    }
    footer {
      border-top: 1px solid #e2e8f0;
      font-size: 0.875rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Aurora Gear</h1>
    <nav aria-label="Main Navigation">
      <a href="/catalog" id="link-catalog">Browse Catalog</a>
      <!-- Link lacking accessible name -->
      <a href="/cart" id="link-cart" class="icon-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
      </a>
      <!-- Properly labeled button -->
      <button type="button" id="btn-help">Help &amp; FAQ</button>
      <!-- Pattern-inferrable empty button -->
      <button type="button" id="btn-close" class="icon-btn btn-close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <!-- Custom AI-inferrable empty button -->
      <button type="button" id="btn-bookmark" class="icon-btn btn-action">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>
      <!-- SVG element with role="button" and pattern class -->
      <svg role="button" tabindex="0" id="btn-svg-close" class="icon-btn btn-close" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </nav>
  </header>

  <main>
    <section class="section-card" aria-labelledby="order-heading">
      <h2 id="order-heading">Quick Order Form</h2>
      
      <!-- Properly labeled input -->
      <div class="form-group">
        <label for="input-email">Account Email</label>
        <input type="email" id="input-email" name="accountEmail">
      </div>

      <!-- Unlabeled input with name attribute -->
      <div class="form-group">
        <input type="text" id="input-code" name="promoCode">
      </div>

      <!-- Unlabeled input with nearby sibling text -->
      <div class="form-row">
        <span id="qty-label">Order Quantity:</span>
        <input type="number" id="input-quantity" min="1" max="10" value="1">
      </div>

      <!-- Properly labeled select -->
      <div class="form-group">
        <label for="select-shipping">Shipping Method</label>
        <select id="select-shipping">
          <option value="standard">Standard Ground</option>
          <option value="express">Express 2-Day</option>
        </select>
      </div>

      <!-- Unlabeled select with name -->
      <div class="form-group">
        <select id="select-country" name="shippingCountry">
          <option value="us">United States</option>
          <option value="ca">Canada</option>
          <option value="gb">United Kingdom</option>
        </select>
      </div>
    </section>

    <section class="section-card" aria-labelledby="embeds-heading">
      <h2 id="embeds-heading">Store Locations &amp; External Feeds</h2>
      
      <!-- Already titled iframe -->
      <div>
        <h3>Community Feed</h3>
        <iframe id="iframe-titled" src="https://example.com/feed" title="Community Activity Feed"></iframe>
      </div>

      <!-- Pattern iframe (Google Maps) -->
      <div>
        <h3>Store Map</h3>
        <iframe id="iframe-map" src="https://maps.google.com/maps?q=flagship"></iframe>
      </div>

      <!-- General URL iframe -->
      <div>
        <h3>Live Inventory Widget</h3>
        <iframe id="iframe-inventory" src="https://inventory-tracker.example.com/embed/stock"></iframe>
      </div>

      <!-- about:blank iframe without hostname -->
      <div>
        <h3>Blank Canvas Frame</h3>
        <iframe id="iframe-blank" src="about:blank"></iframe>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Aurora Gear Shop. Built for outdoor enthusiasts.</p>
  </footer>
</body>
</html>
