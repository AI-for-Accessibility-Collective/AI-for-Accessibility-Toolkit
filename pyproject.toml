[project]
name = "ai4a11y"
version = "0.1.0"
description = "AI-powered accessibility toolkit - CLI for developers and coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "playwright>=1.40.0",
    "pillow>=10.0.0",
    "typer>=0.12.0",
]

[project.scripts]
ai4a11y = "cli.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "tools*"]

# The CLI runs JavaScript in the page for almost everything it does, so these
# files are not extras. Without them an installed ai4a11y cannot inject its
# tools, cannot run an audit or a fix, and reads a page with no Readability.
[tool.setuptools.package-data]
cli = [
    "js/*.js",
    "lib/*.js",
    "cli-tools.bundle.js",
    "axe-core.min.js",
]

[tool.pytest.ini_options]
testpaths = ["cli/tests"]
markers = [
    "browser: spawns a headless Chromium; deselect with -m 'not browser'",
]
