<div class="btn-group btn-group-sm" role="group" aria-label="Colour mode">
  @for (option of options; track option.value) {
    <button
      type="button"
      class="btn"
      [class.btn-light]="colorMode.choice() === option.value"
      [class.btn-outline-secondary]="colorMode.choice() !== option.value"
      [attr.aria-pressed]="colorMode.choice() === option.value"
      (click)="colorMode.choose(option.value)">
      {{ option.label }}
    </button>
  }
</div>
